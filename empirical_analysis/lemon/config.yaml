seed: 20260908
output_dir: outputs_lemon_adjusted
data:
  eeg_root: D:/数据集/LEMON原始EEG
  tmt_csv: ../TMT.csv
  manifest_file: ../manifest.json
  participants_file: outputs_demographics/participants.tsv
  participants_json: outputs_demographics/participants.json
  subject_selection_file: selection_149.json
response:
  column: TMT_5
  primary_transform: log
channels:
  eog_names: [VEOG]
  reference_subject: sub-010002
  min_common_eeg_channels: 58
events:
  min_diagnostic_subjects: 5
  trim_edge_sec: 5.0
  window_sec: 25.0
  n_windows: 16
preprocess:
  l_freq: 1.0
  h_freq: 45.0
  target_sfreq: 250.0
  average_reference: true
bands:
  delta: [1.0, 4.0]
  theta: [4.0, 8.0]
  alpha: [8.0, 13.0]
  beta: [13.0, 30.0]
  gamma: [30.0, 45.0]
psd:
  method: welch
  segment_sec: 4.0
  overlap: 0.5
  average: median
  log_epsilon: 1.0e-20
confounds:
  id_column: participant_id
  age_column: age_band
  sex_column: sex
  # Official source: 1=female, 2=male; encode female=0, male=1.
  sex_mapping: {'1': 0, '2': 1}
  age_encoding: categorical
  age_categories: ['20-25', '25-30', '30-40', '55-65', '65-70', '70-75', '75-80']
  age_reference: '20-25'
  # User-approved adjacent pooling avoids singleton categories in CV.
  age_mapping:
    '20-25': '20-25'
    '25-30': '25-30'
    '30-35': '30-40'
    '35-40': '30-40'
    '55-60': '55-65'
    '60-65': '55-65'
    '65-70': '65-70'
    '70-75': '70-75'
    '75-80': '75-80'
analysis:
  mode: adjusted
  min_samples: 100
  formal_cv_folds: 5
  run_tensor_glasso: true
  run_vector_lasso: true
model:
  k_max: 1
  c: 3.0
  criterion: bic
  n_lambdas: 20
  cv_folds: 5
  max_iter: 500
  tol: 1.0e-6
  max_cycles: 6
  m_max: 15
  eps: 1.0e-8
  adaptive_criterion: msic
  msic_refine_alpha: 1.5
  msic_refine_gamma: 1.0
  msic_refine_one_se_scale: 1.0
report:
  channel_plot: barplot
